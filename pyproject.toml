[project]
name = "agentos"
version = "0.1.0"
description = "Plataforma de agentes autônomos: owner cria departamentos, cada um vira managers + agents que rodam 24/7, comandados por Slack."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "asyncpg>=0.30",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "arq>=0.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
# S (bandit) is on because this process holds DB credentials and provider keys; the rules that
# conflict with FastAPI's idioms are relaxed individually rather than dropping the whole set.
ignore = ["S101"]  # asserts are the test style here

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # tests need fake credentials to assert redaction

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

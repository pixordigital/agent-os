<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AgentOS{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <style>
    /* Dark, no shadows, hairline separators. Contrast >= 12:1 on body text.
       Brass is reserved for "needs attention" so it never loses meaning. */
    :root {
      --ink: #0F1A1C;
      --ink-raised: #16262A;
      --bone: #E9E6DE;
      --bone-dim: #8C9A99;
      --brass: #B98A45;
      --line: #23383C;
      --ok: #4E9A6B;
      --warn: #C98A3E;
      --bad: #B4483C;
      --radius: 2px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--ink); color: var(--bone);
      font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 24px 96px; }
    nav.top { display: flex; gap: 4px; align-items: baseline;
              border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 28px; }
    nav.top .brand { font-size: 17px; font-weight: 650; margin-right: 20px; color: var(--bone);
                     text-decoration: none; }
    nav.top a.tab { color: var(--bone-dim); text-decoration: none; font-size: 13px;
                    padding: 4px 10px; border-radius: var(--radius); }
    nav.top a.tab:hover { color: var(--bone); }
    nav.top a.tab.on { color: var(--bone); border: 1px solid var(--line); background: var(--ink-raised); }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 6px; }
    .sub { color: var(--bone-dim); font-size: 13px; }
    h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
         color: var(--bone-dim); margin: 40px 0 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .card { border: 1px solid var(--line); border-radius: var(--radius);
            padding: 16px 18px; background: var(--ink-raised); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
    .k { color: var(--bone-dim); font-size: 12px; margin-bottom: 6px; }
    .v { font-size: 22px; font-variant-numeric: tabular-nums; }
    .pill { display: inline-block; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase;
            border: 1px solid var(--line); border-radius: var(--radius); padding: 3px 8px;
            color: var(--bone-dim); }
    .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
    .dim { color: var(--bone-dim); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line);
             font-variant-numeric: tabular-nums; vertical-align: top; }
    th { color: var(--bone-dim); font-weight: 500; font-size: 11px; text-transform: uppercase;
         letter-spacing: 0.06em; }
    tr:last-child td { border-bottom: none; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
    a { color: var(--brass); }
    a.plain { color: var(--bone); text-decoration: none; }
    a.plain:hover { text-decoration: underline; }
    form.block label { display: block; font-size: 12px; color: var(--bone-dim); margin: 12px 0 4px; }
    form.block input[type=text], form.block select, form.block textarea {
      width: 100%; background: var(--ink); color: var(--bone);
      border: 1px solid var(--line); border-radius: var(--radius);
      padding: 9px 10px; font: inherit; font-size: 14px; }
    form.block textarea { min-height: 110px; resize: vertical; }
    form.block input:focus, form.block select:focus, form.block textarea:focus {
      outline: none; border-color: var(--brass); }
    .btn { display: inline-block; cursor: pointer; font: inherit; font-size: 13px;
           background: var(--ink); color: var(--bone);
           border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 14px; }
    .btn:hover { border-color: var(--brass); }
    .btn.primary { background: var(--brass); border-color: var(--brass); color: #101315; font-weight: 600; }
    .btn.danger:hover { border-color: var(--bad); color: var(--bad); }
    .btnrow { display: flex; gap: 8px; margin-top: 16px; }
    .err { border: 1px solid var(--bad); border-radius: var(--radius); color: var(--bad);
           padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
    .note { border-left: 2px solid var(--brass); padding: 8px 14px; color: var(--bone-dim);
            font-size: 13px; margin: 16px 0; }
    .cols { display: grid; grid-template-columns: 1fr 340px; gap: 24px; align-items: start; }
    @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
    .foot { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line);
            color: var(--bone-dim); font-size: 12px; }
  </style>
</head>
<body>
<div class="wrap">
  <nav class="top">
    <a class="brand" href="/">AgentOS</a>
    <a class="tab {% if tab == 'home' %}on{% endif %}" href="/">Início</a>
    <a class="tab {% if tab == 'agents' %}on{% endif %}" href="/agents">Agentes</a>
    <a class="tab {% if tab == 'teams' %}on{% endif %}" href="/teams">Times</a>
  </nav>
  {% block body %}{% endblock %}
  <div class="foot">
    Console do operador: mostra a verdade da plataforma, não a visão de um tenant.
    Leituras de tenant chegam com Supabase Auth na onda 2.
  </div>
</div>
{% block scripts %}{% endblock %}
</body>
</html>

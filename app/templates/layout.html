<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F1A1C">
  <script>document.documentElement.classList.add('js');</script>
  <title>{% block title %}AgentOS{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Display voice only; body stays system so the console works fully offline. -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <style>
    /* AgentOS console — mobile-first.
       Base = phone (one column, 16px gutters, 44px targets). Two breakpoints up:
       700px (tables back, wider grids) and 1000px (two-column, top tabs, no tab bar).
       Brass means exactly one thing — "needs attention" — so it never loses meaning. */
    :root {
      --ink: #0C1517;
      --ink-raised: #142327;
      --ink-sunken: #081113;
      --bone: #ECE9E0;
      --bone-dim: #9AA7A5;
      --bone-faint: #63736F;
      --brass: #D2A768;
      --brass-deep: #9A7434;
      --brass-soft: rgba(210, 167, 104, 0.14);
      --line: #24393F;
      --line-soft: #18292D;
      --ok: #5FB87F;
      --warn: #D0A24A;
      --bad: #CE665B;
      --radius: 10px;
      --radius-sm: 7px;
      --radius-lg: 16px;
      --radius-xl: 22px;
      --tap: 44px;
      --tabbar-h: 64px;
      --display: "Fraunces", Georgia, "Times New Roman", serif;
      --grot: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --hairline: linear-gradient(180deg, #2C464D, var(--line-soft));
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.25, 0.64, 1);
      --lift: 0 18px 44px -18px rgba(0, 0, 0, 0.65);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; color: var(--bone);
      /* Depth without images: brass glow top-right, green ember bottom-left, vignette. */
      background:
        radial-gradient(1100px 480px at 88% -8%, rgba(210, 167, 104, 0.10), transparent 62%),
        radial-gradient(860px 520px at -12% 4%, rgba(95, 184, 127, 0.07), transparent 58%),
        radial-gradient(120% 90% at 50% 110%, rgba(0, 0, 0, 0.35), transparent 60%),
        var(--ink);
      background-attachment: fixed;
      font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-variant-numeric: tabular-nums;
      overflow-x: hidden;
    }
    :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 4px; }

    .wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px calc(var(--tabbar-h) + 32px); }

    /* Top bar: brand + health on phone; full tabs on desktop. */
    nav.top { display: flex; align-items: center; gap: 6px;
              padding: 4px 0 14px; margin-bottom: 18px; border-bottom: 1px solid var(--line-soft); }
    nav.top .brand { font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: -0.01em;
                     color: var(--bone); text-decoration: none; margin-right: auto;
                     display: flex; align-items: center; gap: 10px; min-height: var(--tap); }
    nav.top .brand em { font-style: italic; color: var(--brass); }
    .livedot { width: 8px; height: 8px; border-radius: 50%; background: var(--bone-faint); flex: none;
               position: relative; }
    .livedot.ok { background: var(--ok); }
    .livedot.ok::after { content: ""; position: absolute; inset: -4px; border-radius: 50%;
               border: 1px solid var(--ok); opacity: 0; animation: ping 2.4s var(--ease-out) infinite; }
    .livedot.bad { background: var(--bad); }
    @keyframes ping { 0% { transform: scale(.5); opacity: .8; } 80%, 100% { transform: scale(1.25); opacity: 0; } }
    nav.top a.tab { display: none; }

    /* Bottom tab bar: the phone's command surface. Desktop hides it. */
    nav.tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; background: rgba(15, 26, 28, 0.94);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
    }
    nav.tabbar a {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
      min-height: var(--tabbar-h); justify-content: center;
      color: var(--bone-faint); text-decoration: none; font-size: 11px; font-weight: 550;
    }
    nav.tabbar a svg { width: 21px; height: 21px; }
    nav.tabbar a.on { color: var(--bone); }
    nav.tabbar a.on svg { stroke: var(--brass); }
    nav.tabbar a.create svg { stroke: var(--brass); }

    /* Display voice: one serif for headlines + numerals, grotesk for labels, system body. */
    h1 { font-family: var(--display); font-size: clamp(30px, 5vw, 46px); font-weight: 600;
         letter-spacing: -0.02em; line-height: 1.04; margin: 0 0 8px; text-wrap: balance; }
    h1 em { font-style: italic; color: var(--brass); }
    .sub { color: var(--bone-dim); font-size: 14px; max-width: 64ch; }
    .eyebrow { font-family: var(--grot); font-size: 12px; font-weight: 600; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--brass); margin: 0 0 12px;
               display: flex; align-items: center; gap: 10px; }
    .eyebrow::before { content: ""; width: 22px; height: 1px; background: var(--brass-deep); flex: none; }
    .hero { position: relative; padding: 34px 0 10px; }
    .hero .sub { font-size: 15px; }
    .hero-glow { position: absolute; inset: -60px -40px auto auto; width: 420px; height: 300px;
                background: radial-gradient(closest-side, rgba(210, 167, 104, 0.16), transparent);
                pointer-events: none; will-change: transform; }
    h2 { font-family: var(--grot); font-size: 16px; font-weight: 600; letter-spacing: -0.01em;
         color: var(--bone); margin: 40px 0 12px; }
    h2 .dim { font-weight: 400; }
    .sec { font-family: var(--grot); font-size: 12.5px; font-weight: 600; letter-spacing: 0.14em;
           text-transform: uppercase; color: var(--bone-faint); margin: 40px 0 12px;
           display: flex; align-items: center; gap: 10px; }
    .sec::after { content: ""; height: 1px; flex: 1; background: var(--line-soft); }
    .sec .dim { font-weight: 400; text-transform: none; letter-spacing: 0; }

    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    /* Double-bezel nod: gradient hairline outside, 1px top-light inside. */
    .card { border: 1px solid transparent; border-radius: var(--radius-lg);
            padding: 18px 19px;
            background: linear-gradient(var(--ink-raised), var(--ink-raised)) padding-box,
                        var(--hairline) border-box;
            box-shadow: inset 0 1px 0 rgba(236, 233, 224, 0.05);
            transition: transform .35s var(--ease-out), box-shadow .35s var(--ease-out); }
    a.card { display: block; color: inherit; text-decoration: none; }
    a.card:hover { transform: translateY(-2px); box-shadow: inset 0 1px 0 rgba(236,233,224,.07), var(--lift); }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .k { font-family: var(--grot); color: var(--bone-faint); font-size: 11.5px; font-weight: 600;
         letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
    .v { font-family: var(--display); font-size: clamp(30px, 4vw, 38px); font-weight: 600;
         letter-spacing: -0.01em; font-variant-numeric: tabular-nums; line-height: 1.05; }
    .v small { font-family: var(--grot); font-size: 13px; font-weight: 500; color: var(--bone-faint);
              letter-spacing: 0; margin-left: 6px; }
    .flash { animation: valflash 1.1s var(--ease-out); }
    @keyframes valflash {
      0% { text-shadow: 0 0 22px rgba(210, 167, 104, 0.85); }
      100% { text-shadow: none; }
    }
    .pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px;
            border: 1px solid var(--line); border-radius: 99px; padding: 5px 13px;
            color: var(--bone-dim); background: rgba(236, 233, 224, 0.03); }
    .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
    .dim { color: var(--bone-dim); }

    /* Tables become cards under 700px. td carries data-label so no markup is duplicated. */
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th, td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--line-soft);
             font-variant-numeric: tabular-nums; vertical-align: top; }
    th { font-family: var(--grot); color: var(--bone-faint); font-weight: 600; font-size: 11.5px;
         letter-spacing: 0.1em; text-transform: uppercase; }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background .25s var(--ease-out); }
    tbody tr:hover { background: rgba(236, 233, 224, 0.025); }

    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
           background: var(--ink-sunken); padding: 1px 5px; border-radius: 4px; }
    a { color: var(--brass); }
    a.plain { color: var(--bone); text-decoration: none; display: block; padding: 6px 0; }
    a.plain:hover { text-decoration: underline; }

    /* Forms: 16px inputs (no iOS auto-zoom), 44px targets, sticky primary on phone. */
    form.block label { display: block; font-size: 13px; color: var(--bone-dim); margin: 14px 0 5px; font-weight: 550; }
    form.block input[type=text], form.block select, form.block textarea {
      width: 100%; background: var(--ink-sunken); color: var(--bone);
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      padding: 12px 12px; font: inherit; font-size: 16px; min-height: var(--tap); }
    form.block textarea { min-height: 110px; resize: vertical; font-size: 15px; }
    form.block input:focus, form.block select:focus, form.block textarea:focus {
      outline: none; border-color: var(--brass-deep); }
    .btn { display: inline-flex; align-items: center; justify-content: center;
           cursor: pointer; font: inherit; font-size: 14px; font-weight: 600;
           background: var(--ink-sunken); color: var(--bone); min-height: var(--tap);
           border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 16px;
           text-decoration: none;
           transition: transform .2s var(--ease-spring), border-color .25s var(--ease-out),
                      box-shadow .25s var(--ease-out); }
    .btn:hover { border-color: var(--brass-deep); transform: translateY(-1px); }
    .btn:active { transform: translateY(0) scale(.98); }
    .btn.primary { background: linear-gradient(180deg, #DDB672, var(--brass)); border-color: var(--brass);
                   color: #14100A; box-shadow: 0 12px 28px -14px rgba(210, 167, 104, 0.55); }
    .btn.danger:hover { border-color: var(--bad); color: var(--bad); }
    .btnrow { display: flex; gap: 8px; margin-top: 18px; }
    .btnrow .btn.primary { flex: 1; }
    .err { border: 1px solid var(--bad); border-radius: var(--radius-sm); color: var(--bad);
           padding: 11px 14px; font-size: 13.5px; margin-bottom: 16px; background: rgba(192,90,77,.07); }
    .note { border-left: 2px solid var(--brass-deep); padding: 8px 14px; color: var(--bone-dim);
            font-size: 13px; margin: 16px 0; }
    .cols { display: grid; grid-template-columns: 1fr; gap: 8px; align-items: start; }

    /* Fleet strip: the one memorable element. Horizontal snap scroll of agent chips. */
    .fleet { display: flex; gap: 10px; overflow-x: auto; padding: 4px 16px 14px 0;
             scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
             scrollbar-width: none; }
    .fleet::-webkit-scrollbar { display: none; }
    .chip { flex: 0 0 auto; scroll-snap-align: start; display: flex; align-items: center; gap: 9px;
            border: 1px solid var(--line);
            background: linear-gradient(180deg, rgba(233, 230, 222, 0.06), rgba(233, 230, 222, 0) 55%),
                        var(--ink-raised);
            border-radius: 99px; padding: 9px 16px 9px 11px; text-decoration: none; color: var(--bone);
            font-size: 13px; font-weight: 550; min-height: var(--tap);
            transition: transform .3s var(--ease-spring), border-color .3s var(--ease-out),
                        box-shadow .3s var(--ease-out); }
    .chip:hover { transform: translateY(-2px); border-color: var(--brass-deep);
                  box-shadow: 0 10px 26px -14px rgba(0, 0, 0, 0.7); }
    .chip small { color: var(--bone-faint); font-weight: 400; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bone-faint); flex: none; }
    .dot.ok { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.bad { background: var(--bad); }
    .dot.run { background: var(--brass); box-shadow: 0 0 8px rgba(201, 155, 95, 0.9);
                animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }

    .foot { margin-top: 44px; padding-top: 14px; border-top: 1px solid var(--line-soft);
            color: var(--bone-faint); font-size: 12px; }

    .htmx-swapping { opacity: .45; transition: opacity .18s ease; }

    /* Scroll reveal: GPU-only, staggered via --i. Hidden state applies only with JS. */
    .js .reveal { opacity: 0; transform: translateY(16px);
                  transition: opacity .7s var(--ease-out), transform .7s var(--ease-out);
                  transition-delay: calc(var(--i, 0) * 70ms); }
    .reveal.in { opacity: 1; transform: none; }

    @media (prefers-reduced-motion: reduce) {
      .dot.run { animation: none; }
      .livedot.ok::after { animation: none; }
      .htmx-swapping { transition: none; }
      .reveal { opacity: 1; transform: none; transition: none; }
      .flash { animation: none; }
      .card, .chip, .btn, tbody tr { transition: none; }
      .card:hover, .chip:hover, .btn:hover, a.card:hover { transform: none; }
      * { scroll-behavior: auto; }
    }

    /* 700px: tables stop being cards; grids breathe. */
    @media (min-width: 700px) {
      .grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
      form.block input[type=text], form.block select { font-size: 15px; }
      .btnrow .btn.primary { flex: none; }
    }

    /* 1000px: two columns, top tabs, no tab bar. */
    @media (min-width: 1000px) {
      .wrap { padding: 36px 28px 96px; }
      .hero { padding: 48px 0 12px; }
      nav.top a.tab { display: inline-flex; align-items: center; min-height: var(--tap);
                      color: var(--bone-dim); text-decoration: none; font-size: 14px;
                      padding: 6px 12px; border-radius: var(--radius-sm); }
      nav.top a.tab:hover { color: var(--bone); }
      nav.top a.tab.on { color: var(--bone); border: 1px solid var(--line); background: var(--ink-raised); }
      nav.tabbar { display: none; }
      .wrap { padding-bottom: 96px; }
      .cols { grid-template-columns: 1fr 360px; gap: 28px; }
    }

    /* Card-ified tables (phone only). thead hides; each row becomes a card. */
    @media (max-width: 699px) {
      table.cardtable thead { display: none; }
      table.cardtable, table.cardtable tbody, table.cardtable tr, table.cardtable td { display: block; }
      table.cardtable tr { border: 1px solid var(--line-soft); border-radius: var(--radius);
                           background: var(--ink-raised); margin-bottom: 10px; padding: 6px 14px; }
      table.cardtable td { border: none; padding: 7px 0; }
      table.cardtable td + td { border-top: 1px solid var(--line-soft); }
      table.cardtable td::before { content: attr(data-label); display: block;
                                   font-size: 12px; color: var(--bone-faint); margin-bottom: 2px; }
      table.cardtable td.no-label::before { display: none; }
      table.cardtable td.actions { padding-top: 10px; }
      table.cardtable td.actions .btn { width: 100%; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <nav class="top" aria-label="Principal">
    <a class="brand" href="/"><span class="livedot" id="livedot"></span>Agent<em>OS</em></a>
    <a class="tab {% if tab == 'home' %}on{% endif %}" href="/">Início</a>
    <a class="tab {% if tab == 'agents' %}on{% endif %}" href="/agents">Agentes</a>
    <a class="tab {% if tab == 'teams' %}on{% endif %}" href="/teams">Times</a>
    <a class="tab {% if tab == 'org' %}on{% endif %}" href="/org">Organograma</a>
  </nav>
  {% block body %}{% endblock %}
  <div class="foot">
    Console do operador: mostra a verdade da plataforma, não a visão de um tenant.
  </div>
</div>
<nav class="tabbar" aria-label="Navegação">
  <a href="/" class="{% if tab == 'home' %}on{% endif %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    Início</a>
  <a href="/agents" class="{% if tab == 'agents' %}on{% endif %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c.6-3.4 2.9-5 5.5-5s4.9 1.6 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.6c2.9.1 4.4 1.7 5 4.4"/></svg>
    Agentes</a>
  <a href="/teams" class="{% if tab == 'teams' %}on{% endif %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
    Times</a>
  <a href="/agents#criar" class="create">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8.5v7M8.5 12h7"/></svg>
    Novo</a>
</nav>
<script>
  // Shared motion: reveal-on-scroll, hero parallax, count-up. All transform/opacity,
  // all gated on prefers-reduced-motion. Vanilla, no deps.
  (() => {
    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const io = ('IntersectionObserver' in window && !calm) ? new IntersectionObserver((es) => {
      es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.12 }) : null;
    window.__reveal = (root) => (root || document).querySelectorAll('.reveal:not(.in)').forEach((el) => {
      if (io) io.observe(el); else el.classList.add('in');
    });
    window.__reveal(document);
    // Hero glow parallax, rAF-throttled, transform only.
    if (!calm) {
      let ticking = false;
      addEventListener('scroll', () => {
        if (ticking) return; ticking = true;
        requestAnimationFrame(() => {
          document.querySelectorAll('.hero-glow').forEach((g) => {
            g.style.transform = `translateY(${Math.min(scrollY * 0.12, 120)}px)`;
          });
          ticking = false;
        });
      }, { passive: true });
    }
  })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>

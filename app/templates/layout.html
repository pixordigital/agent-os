<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F1A1C">
  <title>{% block title %}AgentOS{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <style>
    /* AgentOS console — mobile-first.
       Base = phone (one column, 16px gutters, 44px targets). Two breakpoints up:
       700px (tables back, wider grids) and 1000px (two-column, top tabs, no tab bar).
       Brass means exactly one thing — "needs attention" — so it never loses meaning. */
    :root {
      --ink: #0F1A1C;
      --ink-raised: #152326;
      --ink-sunken: #0B1416;
      --bone: #E9E6DE;
      --bone-dim: #93A19F;
      --bone-faint: #5F6E6D;
      --brass: #C99B5F;
      --brass-deep: #9A7434;
      --line: #22363B;
      --line-soft: #1A2B2F;
      --ok: #58A773;
      --warn: #C9973F;
      --bad: #C05A4D;
      --radius: 10px;
      --radius-sm: 7px;
      --tap: 44px;
      --tabbar-h: 64px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--ink); color: var(--bone);
      font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-variant-numeric: tabular-nums;
    }
    :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 4px; }

    .wrap { max-width: 1120px; margin: 0 auto; padding: 20px 16px calc(var(--tabbar-h) + 32px); }

    /* Top bar: brand + health on phone; full tabs on desktop. */
    nav.top { display: flex; align-items: center; gap: 6px;
              padding: 4px 0 14px; margin-bottom: 18px; border-bottom: 1px solid var(--line-soft); }
    nav.top .brand { font-size: 17px; font-weight: 700; letter-spacing: -0.01em;
                     color: var(--bone); text-decoration: none; margin-right: auto;
                     display: flex; align-items: center; gap: 9px; min-height: var(--tap); }
    .livedot { width: 8px; height: 8px; border-radius: 50%; background: var(--bone-faint); flex: none; }
    .livedot.ok { background: var(--ok); }
    .livedot.bad { background: var(--bad); }
    nav.top a.tab { display: none; }

    /* Bottom tab bar: the phone's command surface. Desktop hides it. */
    nav.tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; background: rgba(15, 26, 28, 0.94);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
    }
    nav.tabbar a {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
      min-height: var(--tabbar-h); justify-content: center;
      color: var(--bone-faint); text-decoration: none; font-size: 11px; font-weight: 550;
    }
    nav.tabbar a svg { width: 21px; height: 21px; }
    nav.tabbar a.on { color: var(--bone); }
    nav.tabbar a.on svg { stroke: var(--brass); }
    nav.tabbar a.create svg { stroke: var(--brass); }

    h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; }
    .sub { color: var(--bone-dim); font-size: 13.5px; }
    h2 { font-size: 15px; font-weight: 650; color: var(--bone); margin: 32px 0 10px; }
    h2 .dim { font-weight: 400; }

    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .card { border: 1px solid var(--line-soft); border-radius: var(--radius);
            padding: 14px 15px; background: var(--ink-raised); }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .k { color: var(--bone-dim); font-size: 12.5px; margin-bottom: 5px; }
    .v { font-size: 21px; font-weight: 650; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
    .pill { display: inline-block; font-size: 12px;
            border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px;
            color: var(--bone-dim); }
    .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
    .dim { color: var(--bone-dim); }

    /* Tables become cards under 700px. td carries data-label so no markup is duplicated. */
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th, td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--line-soft);
             font-variant-numeric: tabular-nums; vertical-align: top; }
    th { color: var(--bone-faint); font-weight: 550; font-size: 12px; }
    tr:last-child td { border-bottom: none; }

    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
           background: var(--ink-sunken); padding: 1px 5px; border-radius: 4px; }
    a { color: var(--brass); }
    a.plain { color: var(--bone); text-decoration: none; display: block; padding: 6px 0; }
    a.plain:hover { text-decoration: underline; }

    /* Forms: 16px inputs (no iOS auto-zoom), 44px targets, sticky primary on phone. */
    form.block label { display: block; font-size: 13px; color: var(--bone-dim); margin: 14px 0 5px; font-weight: 550; }
    form.block input[type=text], form.block select, form.block textarea {
      width: 100%; background: var(--ink-sunken); color: var(--bone);
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      padding: 12px 12px; font: inherit; font-size: 16px; min-height: var(--tap); }
    form.block textarea { min-height: 110px; resize: vertical; font-size: 15px; }
    form.block input:focus, form.block select:focus, form.block textarea:focus {
      outline: none; border-color: var(--brass-deep); }
    .btn { display: inline-flex; align-items: center; justify-content: center;
           cursor: pointer; font: inherit; font-size: 14px; font-weight: 600;
           background: var(--ink-sunken); color: var(--bone); min-height: var(--tap);
           border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 16px;
           text-decoration: none; }
    .btn:hover { border-color: var(--brass-deep); }
    .btn.primary { background: var(--brass); border-color: var(--brass); color: #14100A; }
    .btn.danger:hover { border-color: var(--bad); color: var(--bad); }
    .btnrow { display: flex; gap: 8px; margin-top: 18px; }
    .btnrow .btn.primary { flex: 1; }
    .err { border: 1px solid var(--bad); border-radius: var(--radius-sm); color: var(--bad);
           padding: 11px 14px; font-size: 13.5px; margin-bottom: 16px; background: rgba(192,90,77,.07); }
    .note { border-left: 2px solid var(--brass-deep); padding: 8px 14px; color: var(--bone-dim);
            font-size: 13px; margin: 16px 0; }
    .cols { display: grid; grid-template-columns: 1fr; gap: 8px; align-items: start; }

    /* Fleet strip: the one memorable element. Horizontal snap scroll of agent chips. */
    .fleet { display: flex; gap: 10px; overflow-x: auto; padding: 4px 16px 14px 0;
             scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
             scrollbar-width: none; }
    .fleet::-webkit-scrollbar { display: none; }
    .chip { flex: 0 0 auto; scroll-snap-align: start; display: flex; align-items: center; gap: 9px;
            border: 1px solid var(--line-soft); background: var(--ink-raised);
            border-radius: 99px; padding: 9px 15px 9px 11px; text-decoration: none; color: var(--bone);
            font-size: 13px; font-weight: 550; min-height: var(--tap); }
    .chip small { color: var(--bone-faint); font-weight: 400; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bone-faint); flex: none; }
    .dot.ok { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.bad { background: var(--bad); }
    .dot.run { background: var(--brass); animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }

    .foot { margin-top: 44px; padding-top: 14px; border-top: 1px solid var(--line-soft);
            color: var(--bone-faint); font-size: 12px; }

    .htmx-swapping { opacity: .45; transition: opacity .18s ease; }

    @media (prefers-reduced-motion: reduce) {
      .dot.run { animation: none; }
      .htmx-swapping { transition: none; }
      * { scroll-behavior: auto; }
    }

    /* 700px: tables stop being cards; grids breathe. */
    @media (min-width: 700px) {
      .grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
      form.block input[type=text], form.block select { font-size: 15px; }
      .btnrow .btn.primary { flex: none; }
    }

    /* 1000px: two columns, top tabs, no tab bar. */
    @media (min-width: 1000px) {
      .wrap { padding: 36px 28px 96px; }
      h1 { font-size: 24px; }
      nav.top a.tab { display: inline-flex; align-items: center; min-height: var(--tap);
                      color: var(--bone-dim); text-decoration: none; font-size: 14px;
                      padding: 6px 12px; border-radius: var(--radius-sm); }
      nav.top a.tab:hover { color: var(--bone); }
      nav.top a.tab.on { color: var(--bone); border: 1px solid var(--line); background: var(--ink-raised); }
      nav.tabbar { display: none; }
      .wrap { padding-bottom: 96px; }
      .cols { grid-template-columns: 1fr 360px; gap: 28px; }
    }

    /* Card-ified tables (phone only). thead hides; each row becomes a card. */
    @media (max-width: 699px) {
      table.cardtable thead { display: none; }
      table.cardtable, table.cardtable tbody, table.cardtable tr, table.cardtable td { display: block; }
      table.cardtable tr { border: 1px solid var(--line-soft); border-radius: var(--radius);
                           background: var(--ink-raised); margin-bottom: 10px; padding: 6px 14px; }
      table.cardtable td { border: none; padding: 7px 0; }
      table.cardtable td + td { border-top: 1px solid var(--line-soft); }
      table.cardtable td::before { content: attr(data-label); display: block;
                                   font-size: 12px; color: var(--bone-faint); margin-bottom: 2px; }
      table.cardtable td.no-label::before { display: none; }
      table.cardtable td.actions { padding-top: 10px; }
      table.cardtable td.actions .btn { width: 100%; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <nav class="top" aria-label="Principal">
    <a class="brand" href="/"><span class="livedot" id="livedot"></span>AgentOS</a>
    <a class="tab {% if tab == 'home' %}on{% endif %}" href="/">Início</a>
    <a class="tab {% if tab == 'agents' %}on{% endif %}" href="/agents">Agentes</a>
    <a class="tab {% if tab == 'teams' %}on{% endif %}" href="/teams">Times</a>
  </nav>
  {% block body %}{% endblock %}
  <div class="foot">
    Console do operador: mostra a verdade da plataforma, não a visão de um tenant.
  </div>
</div>
<nav class="tabbar" aria-label="Navegação">
  <a href="/" class="{% if tab == 'home' %}on{% endif %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    Início</a>
  <a href="/agents" class="{% if tab == 'agents' %}on{% endif %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c.6-3.4 2.9-5 5.5-5s4.9 1.6 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.6c2.9.1 4.4 1.7 5 4.4"/></svg>
    Agentes</a>
  <a href="/teams" class="{% if tab == 'teams' %}on{% endif %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
    Times</a>
  <a href="/agents#criar" class="create">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8.5v7M8.5 12h7"/></svg>
    Novo</a>
</nav>
{% block scripts %}{% endblock %}
</body>
</html>
